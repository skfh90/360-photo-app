buildscript {
    repositories {
        maven { url uri("${rootDir}/offline/maven-repo") }
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:4.1.3'
    }
}

allprojects {
    repositories {
        maven { url uri("${rootDir}/offline/maven-repo") }
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
